name: Deployment checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deployment-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    outputs:
      snapshot: ${{ steps.capture.outputs.snapshot }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare logs
        run: mkdir -p verification-logs
      - name: Clean install
        id: install
        run: npm ci 2>&1 | tee verification-logs/install.log
      - name: Lint
        id: lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee verification-logs/lint.log
      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee verification-logs/typecheck.log
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee verification-logs/unit-tests.log
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build 2>&1 | tee verification-logs/build.log
      - name: Audit built HTML
        id: html
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/audit-built-html.py 2>&1 | tee verification-logs/built-html.log
      - name: Install Linux browser dependencies
        id: browser_deps
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install-deps chromium 2>&1 | tee verification-logs/browser-dependencies.log
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install chromium 2>&1 | tee verification-logs/browser-install.log
      - name: Playwright tests
        id: e2e
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npx playwright test 2>&1 | tee verification-logs/playwright.log
      - name: Dependency audit
        id: audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high 2>&1 | tee verification-logs/dependencies.log
      - name: Reporting regression tests
        id: report_tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests/automation -v 2>&1 | tee verification-logs/report-tests.log
      - name: Preserve verification results
        id: artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: deployment-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            verification-logs/
            dist/
            docs/audit-pages.md
            playwright-report/
            test-results/
      - name: Capture verification outcomes
        id: capture
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python scripts/automation-report.py --capture

  verify-preview:
    outputs:
      snapshot: ${{ steps.capture.outputs.snapshot }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare logs
        run: mkdir -p verification-logs
      - name: Clean install
        id: install
        run: npm ci 2>&1 | tee verification-logs/preview-install.log
      - name: Find matching Cloudflare preview
        id: resolve
        run: python scripts/resolve-preview-url.py
      - name: Verify deployed HTTP and HTML
        id: http
        run: python scripts/audit-deployed-site.py "$PLAYWRIGHT_BASE_URL" 2>&1 | tee verification-logs/preview-http.log
      - name: Install Chromium and Linux dependencies
        id: browser
        run: npx playwright install --with-deps chromium 2>&1 | tee verification-logs/preview-browser-install.log
      - name: Test deployed preview
        id: e2e
        run: npx playwright test --workers=1 --retries=0 2>&1 | tee verification-logs/preview-playwright.log
      - name: Preserve preview verification
        id: artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: preview-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            verification-logs/
            docs/audit-pages.md
            playwright-report/
            test-results/
      - name: Capture preview outcomes
        id: capture
        if: ${{ always() }}
        env:
          STEPS: ${{ toJSON(steps) }}
        run: python scripts/automation-report.py --capture

  report:
    needs: [verify, verify-preview]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Write evidence and release recommendation
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python scripts/automation-report.py
      - name: Preserve automation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: automation-report-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: verification-logs/automation-report.*
