name: Deployment checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare logs
        run: mkdir -p verification-logs
      - name: Clean install
        id: install
        run: npm ci 2>&1 | tee verification-logs/install.log
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint 2>&1 | tee verification-logs/lint.log
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck 2>&1 | tee verification-logs/typecheck.log
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test 2>&1 | tee verification-logs/unit-tests.log
      - name: Production build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build 2>&1 | tee verification-logs/build.log
      - name: Audit built HTML
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python scripts/audit-built-html.py 2>&1 | tee verification-logs/built-html.log
      - name: Install Linux browser dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install-deps chromium 2>&1 | tee verification-logs/browser-dependencies.log
      - name: Install Chromium
        id: browser
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx playwright install chromium 2>&1 | tee verification-logs/browser-install.log
      - name: Playwright tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.browser.outcome == 'success' }}
        run: npx playwright test 2>&1 | tee verification-logs/playwright.log
      - name: Dependency audit
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high 2>&1 | tee verification-logs/dependencies.log
      - name: Preserve verification results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: deployment-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            verification-logs/
            dist/
            docs/audit-pages.md
            playwright-report/
            test-results/
