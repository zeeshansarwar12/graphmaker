<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">Test scores by class</title>
  <desc id="description">Box plots of test scores for Class A and Class B. The medians are 80.5 and 83, with no outliers in either class.</desc>
  <rect width="800" height="500" rx="12" fill="white" stroke="#dbe3ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="400" y="40" text-anchor="middle" fill="#10213a" font-size="26">Test scores by class</text>
    <line x1="90" y1="420" x2="750" y2="420" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="426" text-anchor="end" fill="#52627a" font-size="18">65</text><line x1="90" y1="366.67" x2="750" y2="366.67" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="372.67" text-anchor="end" fill="#52627a" font-size="18">70</text><line x1="90" y1="313.33" x2="750" y2="313.33" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="319.33" text-anchor="end" fill="#52627a" font-size="18">75</text><line x1="90" y1="260" x2="750" y2="260" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="266" text-anchor="end" fill="#52627a" font-size="18">80</text><line x1="90" y1="206.67" x2="750" y2="206.67" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="212.67" text-anchor="end" fill="#52627a" font-size="18">85</text><line x1="90" y1="153.33" x2="750" y2="153.33" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="159.33" text-anchor="end" fill="#52627a" font-size="18">90</text><line x1="90" y1="100" x2="750" y2="100" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="106" text-anchor="end" fill="#52627a" font-size="18">95</text><line x1="255" y1="420" x2="255" y2="426" stroke="#52627a" stroke-width="1"/><text x="255" y="447" text-anchor="middle" fill="#52627a" font-size="18">Class A</text><line x1="585" y1="420" x2="585" y2="426" stroke="#52627a" stroke-width="1"/><text x="585" y="447" text-anchor="middle" fill="#52627a" font-size="18">Class B</text><line x1="90" y1="100" x2="90" y2="420" stroke="#52627a" stroke-width="2"/><line x1="90" y1="420" x2="750" y2="420" stroke="#52627a" stroke-width="2"/><text x="420" y="482" text-anchor="middle" fill="#10213a" font-size="18">Class</text><g transform="rotate(-90 26 260)"><text x="26" y="260" text-anchor="middle" fill="#10213a" font-size="18">Test score</text></g><g><title>Class A: Q1 72, median 80.5, Q3 88, whiskers 67–94, outliers none</title><line x1="255" y1="398.67" x2="255" y2="110.67" stroke="#2563eb" stroke-width="3"/><line x1="231" y1="398.67" x2="279" y2="398.67" stroke="#2563eb" stroke-width="3"/><line x1="231" y1="110.67" x2="279" y2="110.67" stroke="#2563eb" stroke-width="3"/><rect x="201" y="174.67" width="108" height="170.66" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="201" y1="254.67" x2="309" y2="254.67" stroke="#10213a" stroke-width="3"/></g><g><title>Class B: Q1 78, median 83, Q3 89, whiskers 74–92, outliers none</title><line x1="585" y1="324" x2="585" y2="132" stroke="#2563eb" stroke-width="3"/><line x1="561" y1="324" x2="609" y2="324" stroke="#2563eb" stroke-width="3"/><line x1="561" y1="132" x2="609" y2="132" stroke="#2563eb" stroke-width="3"/><rect x="531" y="164" width="108" height="117.32999999999998" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><line x1="531" y1="228" x2="639" y2="228" stroke="#10213a" stroke-width="3"/></g>
  </g>
</svg>
