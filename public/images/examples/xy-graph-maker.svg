<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title description">
  <title id="title">Two Y series on one X axis</title>
  <desc id="description">XY graph connecting three points in each of two series, Y1 and Y2, at X values −2, 0, and 3.</desc>
  <rect width="800" height="500" rx="12" fill="white" stroke="#dbe3ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="400" y="40" text-anchor="middle" fill="#10213a" font-size="26">Two Y series on one X axis</text>
    <line x1="90" y1="420" x2="750" y2="420" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="426" text-anchor="end" fill="#52627a" font-size="18">-4</text><line x1="90" y1="366.67" x2="750" y2="366.67" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="372.67" text-anchor="end" fill="#52627a" font-size="18">-2</text><line x1="90" y1="313.33" x2="750" y2="313.33" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="319.33" text-anchor="end" fill="#52627a" font-size="18">0</text><line x1="90" y1="260" x2="750" y2="260" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="266" text-anchor="end" fill="#52627a" font-size="18">2</text><line x1="90" y1="206.67" x2="750" y2="206.67" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="212.67" text-anchor="end" fill="#52627a" font-size="18">4</text><line x1="90" y1="153.33" x2="750" y2="153.33" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="159.33" text-anchor="end" fill="#52627a" font-size="18">6</text><line x1="90" y1="100" x2="750" y2="100" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="106" text-anchor="end" fill="#52627a" font-size="18">8</text><line x1="104" y1="420" x2="104" y2="426" stroke="#52627a" stroke-width="1"/><text x="104" y="447" text-anchor="middle" fill="#52627a" font-size="18">-2</text><line x1="230.4" y1="420" x2="230.4" y2="426" stroke="#52627a" stroke-width="1"/><text x="230.4" y="447" text-anchor="middle" fill="#52627a" font-size="18">-1</text><line x1="356.8" y1="420" x2="356.8" y2="426" stroke="#52627a" stroke-width="1"/><text x="356.8" y="447" text-anchor="middle" fill="#52627a" font-size="18">0</text><line x1="483.2" y1="420" x2="483.2" y2="426" stroke="#52627a" stroke-width="1"/><text x="483.2" y="447" text-anchor="middle" fill="#52627a" font-size="18">1</text><line x1="609.6" y1="420" x2="609.6" y2="426" stroke="#52627a" stroke-width="1"/><text x="609.6" y="447" text-anchor="middle" fill="#52627a" font-size="18">2</text><line x1="736" y1="420" x2="736" y2="426" stroke="#52627a" stroke-width="1"/><text x="736" y="447" text-anchor="middle" fill="#52627a" font-size="18">3</text><line x1="90" y1="100" x2="90" y2="420" stroke="#52627a" stroke-width="2"/><line x1="90" y1="420" x2="750" y2="420" stroke="#52627a" stroke-width="2"/><text x="420" y="482" text-anchor="middle" fill="#10213a" font-size="18">X</text><g transform="rotate(-90 26 260)"><text x="26" y="260" text-anchor="middle" fill="#10213a" font-size="18">Y</text></g><circle cx="105" cy="74" r="5" fill="#2563eb"/><text x="118" y="80" text-anchor="start" fill="#10213a" font-size="18">Y1</text><polyline points="104,420 356.8,313.33 736,153.33" fill="none" stroke="#2563eb" stroke-width="3"/><circle cx="104" cy="420" r="5" fill="#2563eb"/><circle cx="356.8" cy="313.33" r="5" fill="#2563eb"/><circle cx="736" cy="153.33" r="5" fill="#2563eb"/><circle cx="250" cy="74" r="5" fill="#079669"/><text x="263" y="80" text-anchor="start" fill="#10213a" font-size="18">Y2</text><polyline points="104,233.33 356.8,180 736,126.67" fill="none" stroke="#079669" stroke-width="3"/><circle cx="104" cy="233.33" r="5" fill="#079669"/><circle cx="356.8" cy="180" r="5" fill="#079669"/><circle cx="736" cy="126.67" r="5" fill="#079669"/>
  </g>
