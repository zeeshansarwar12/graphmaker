<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title id="title">Price ceiling</title>
  <rect width="800" height="500" rx="12" fill="white" stroke="#dbe3ee"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="400" y="40" text-anchor="middle" fill="#10213a" font-size="26">Price ceiling</text>
    <line x1="90" y1="420" x2="750" y2="420" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="426" text-anchor="end" fill="#52627a" font-size="18">0</text><line x1="90" y1="380" x2="750" y2="380" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="386" text-anchor="end" fill="#52627a" font-size="18">5</text><line x1="90" y1="260" x2="750" y2="260" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="266" text-anchor="end" fill="#52627a" font-size="18">20</text><line x1="90" y1="212" x2="750" y2="212" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="218" text-anchor="end" fill="#52627a" font-size="18">26</text><line x1="90" y1="100" x2="750" y2="100" stroke="#dbe3ee" stroke-width="1"/><text x="78" y="106" text-anchor="end" fill="#52627a" font-size="18">40</text><line x1="90" y1="420" x2="90" y2="426" stroke="#52627a" stroke-width="1"/><text x="90" y="447" text-anchor="middle" fill="#52627a" font-size="18">0</text><line x1="337.5" y1="420" x2="337.5" y2="426" stroke="#52627a" stroke-width="1"/><text x="337.5" y="447" text-anchor="middle" fill="#52627a" font-size="18">30</text><line x1="436.5" y1="420" x2="436.5" y2="426" stroke="#52627a" stroke-width="1"/><text x="436.5" y="447" text-anchor="middle" fill="#52627a" font-size="18">42</text><line x1="585" y1="420" x2="585" y2="426" stroke="#52627a" stroke-width="1"/><text x="585" y="447" text-anchor="middle" fill="#52627a" font-size="18">60</text><line x1="90" y1="100" x2="90" y2="420" stroke="#52627a" stroke-width="2"/><line x1="90" y1="420" x2="750" y2="420" stroke="#52627a" stroke-width="2"/><text x="420" y="482" text-anchor="middle" fill="#10213a" font-size="18">Quantity</text><g transform="rotate(-90 26 260)"><text x="26" y="260" text-anchor="middle" fill="#10213a" font-size="18">Price</text></g><polygon points="90,260 90,100 337.5,180 337.5,260" fill="#2563eb" fill-opacity=".23" /><polygon points="90,260 337.5,260 337.5,260 90,380" fill="#079669" fill-opacity=".23" /><polygon points="337.5,260 337.5,180 436.5,212" fill="#d97706" fill-opacity=".23" /><line x1="90" y1="260" x2="750" y2="260" stroke="#52627a" stroke-opacity=".6" stroke-dasharray="5 4"/><line x1="90" y1="212" x2="750" y2="212" stroke="#52627a" stroke-opacity=".6" stroke-dasharray="5 4"/><line x1="337.5" y1="420" x2="337.5" y2="180" stroke="#52627a" stroke-dasharray="5 4"/><line x1="436.5" y1="420" x2="436.5" y2="212" stroke="#52627a" stroke-dasharray="5 4"/><line x1="585" y1="420" x2="585" y2="260" stroke="#52627a" stroke-dasharray="5 4"/><line x1="90" y1="100" x2="750" y2="313.33" stroke="#2563eb" stroke-width="3"/><line x1="90" y1="380" x2="667.5" y2="100" stroke="#079669" stroke-width="3"/><text x="745" y="333.33" text-anchor="end" fill="#2563eb" font-size="18">Demand</text><text x="662.5" y="90" text-anchor="end" fill="#079669" font-size="18">Supply</text><circle cx="436.5" cy="212" r="5" fill="#10213a"/><text x="445.5" y="204" text-anchor="start" fill="#10213a" font-size="15">E</text><circle cx="100" cy="68" r="5" fill="#2563eb"/><text x="112" y="74" text-anchor="start" fill="#10213a" font-size="14">Consumer surplus</text><circle cx="268" cy="68" r="5" fill="#079669"/><text x="280" y="74" text-anchor="start" fill="#10213a" font-size="14">Producer surplus</text><circle cx="436" cy="68" r="5" fill="#d97706"/><text x="448" y="74" text-anchor="start" fill="#10213a" font-size="14">Deadweight loss</text>
